[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-opportunity-intelligence"
version = "0.2.0"
description = "Opportunity synthesis consumer of free-only local domain data-product APIs (ports 8101–8107)."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
# Gold Parquet write + DuckDB read via the shared lake-first runtime, pinned to
# an exact commit so CI runs the lake tests reproducibly. Inside the monorepo
# (or with SOLO_EMPIRE_ROOT) the parent `infra/scripts/data_lake` still works.
lake = [
  "pyarrow>=14",
  "duckdb>=0.10",
  "solo-empire-data-lake[lake] @ https://github.com/bookchaowalit/solo-empire-data-lake/archive/4c24c667e1ebafee163705b1c8b9b9f8c83e3185.tar.gz",
]
dev = ["ruff"]

[project.scripts]
book-opportunity-intelligence = "book_opportunities.ingest:main"
book-opportunity-intelligence-api = "book_opportunities.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
