[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-opportunity-intelligence"
version = "0.2.0"
description = "Opportunity synthesis consumer of free-only local domain data-product APIs (ports 8101–8107)."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
# Gold Parquet write + DuckDB read via the shared lake-first runtime, pinned to
# an exact commit so CI runs the lake tests reproducibly. Without the
# package, SOLO_DATA_LAKE_ROOT may point at a solo-data-lake checkout.
lake = [
  "pyarrow>=14",
  "duckdb>=0.10",
  "solo-empire-data-lake[lake] @ https://github.com/bookchaowalit/solo-empire-data-lake/archive/b8f8698995a4d4283247bd432d521b337ef8ec94.tar.gz",
]
dev = ["ruff"]

[project.scripts]
book-opportunity-intelligence = "book_opportunities.ingest:main"
book-opportunity-intelligence-api = "book_opportunities.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
