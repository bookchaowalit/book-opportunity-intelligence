[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "book-opportunity-intelligence"
version = "0.2.0"
description = "Opportunity synthesis consumer of free-only local domain data-product APIs (ports 8101–8107)."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
# Gold Parquet write + DuckDB read. The shared helpers also need the monorepo
# `infra/scripts/data_lake` package: nest this repo inside it or set
# SOLO_EMPIRE_ROOT. Without both, the 27 lake tests skip.
lake = ["pyarrow>=14", "duckdb>=0.10"]
dev = ["ruff"]

[project.scripts]
book-opportunity-intelligence = "book_opportunities.ingest:main"
book-opportunity-intelligence-api = "book_opportunities.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
