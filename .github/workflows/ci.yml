name: CI

on:
  # Gate every branch, not only main (feature branches were untested).
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FREE_ONLY: "true"
      ALLOW_PAID_PROVIDERS: "false"
      ALLOW_EXTERNAL_WRITES: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check --select F src tests scripts
      # Unit/contract suite only. Opt-in multi-API e2e requires sibling repos + free ports 8101–8108:
      #   RUN_LOCAL_E2E=1 PYTHONPATH=src python tests/integration/test_local_e2e_smoke.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: python -m book_opportunities.ingest --help
      - run: book-opportunity-intelligence --help
      # Packaging: the sdist/wheel must build and the wheel must import.
      - run: python -m pip install build && python -m build --outdir dist .
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl && python -c "import book_opportunities.synthesis"
