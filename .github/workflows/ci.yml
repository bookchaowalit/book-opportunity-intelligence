name: CI

on:
  # Gate every branch, not only main (feature branches were untested).
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FREE_ONLY: "true"
      ALLOW_PAID_PROVIDERS: "false"
      ALLOW_EXTERNAL_WRITES: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # [lake] installs the pinned solo-empire-data-lake runtime, so the
      # Gold/DuckDB tests run here instead of skipping.
      - run: python -m pip install -e ".[dev,lake]"
      - name: Check shared lake runtime is importable
        run: python -c "from book_opportunities import gold; assert gold.shared_runtime_available()"
      - run: ruff check --select F src tests
      # Unit/contract suite only. The multi-API self-launcher and its opt-in
      # e2e were retired 2026-10-15 (BOO-248); see docs/opportunity-v1-consumer-scan-2026-10-15.md.
      - name: Tests (standalone, including Gold lake integration)
        env:
          SOLO_EMPIRE_DATA_LAKE_URI: ${{ runner.temp }}/opportunity-lake
        run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: python -m book_opportunities.ingest --help
      - run: book-opportunity-intelligence --help
      # Packaging: the sdist/wheel must build and the wheel must import.
      - run: python -m pip install build && python -m build --outdir dist .
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl && python -c "import book_opportunities.synthesis"
